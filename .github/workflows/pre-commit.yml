name: pre-commit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-all-files:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.8
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: |
            .pre-commit-config.yaml
            .github/workflows/pre-commit.yaml

      - name: Install pre-commit tooling
        run: |
          python -m pip install \
            pip==24.0 setuptools==65.7.0 wheel==0.38.4 \
            pre-commit==3.5.0 virtualenv==20.26.6 PyYAML==6.0.2
          python -m pip check

      - name: Prepare CI hook configuration
        run: |
          # Normalize legacy configuration in runner temp storage only.
          # Keep the tracked config, source, hook versions and rules unchanged.
          python - <<'PY'
          import os
          from pathlib import Path

          import yaml

          config = yaml.safe_load(Path(".pre-commit-config.yaml").read_text())
          config["default_language_version"] = {"python": "python3.8"}
          for repo in config["repos"]:
              if repo["repo"] == "https://gitlab.com/pycqa/flake8":
                  repo["repo"] = "https://github.com/PyCQA/flake8"
              for hook in repo["hooks"]:
                  excluded = hook.get("exclude")
                  if isinstance(excluded, list):
                      hook["exclude"] = "(?:" + "|".join(excluded) + ")"
                  dependencies = hook.setdefault("additional_dependencies", [])
                  dependencies.append("setuptools==65.7.0")
                  if hook["id"] == "flake8":
                      dependencies[:] = [
                          "flake8-import-order==0.18.2"
                          if item == "flake8-import-order" else item
                          for item in dependencies
                      ]
                  elif hook["id"] == "mypy":
                      dependencies.append("typed-ast==1.4.3")

          config_path = Path(os.environ["RUNNER_TEMP"]) / "pre-commit-ci.yaml"
          config_path.write_text(yaml.safe_dump(config, sort_keys=False))
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write(f"PRE_COMMIT_CONFIG={config_path}\n")
              stream.write(f"PRE_COMMIT_HOME={os.environ['RUNNER_TEMP']}/pre-commit-cache\n")
          PY
          PRE_COMMIT_HOME="$RUNNER_TEMP/pre-commit-cache" \
            python -m pre_commit validate-config "$RUNNER_TEMP/pre-commit-ci.yaml"

      - name: Cache hook environments
        uses: actions/cache@v4
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: pre-commit-${{ runner.os }}-python3.8-${{ hashFiles('.pre-commit-config.yaml', '.github/workflows/pre-commit.yaml') }}

      - name: Run all pre-commit hooks
        run: |
          python -m pre_commit run --config "$PRE_COMMIT_CONFIG" \
            --all-files --show-diff-on-failure --color always
